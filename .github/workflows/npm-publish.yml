name: Publish to NPM

# npm Trusted Publisher (OIDC) — NPM_TOKEN secret хэрэггүй.
# npmjs.com → auth-mn → Settings → Trusted Publisher → GitHub Actions:
#   Organization/user: togtokh-dev · Repository: auth-mn · Workflow filename: npm-publish.yml · Environment: (хоосон)
# main руу push хийхэд package.json-ы version npm дээр байхгүй бол л publish хийнэ
# (ижил version дахин publish хийхийг оролдохгүй). Гараар ч ажиллуулж болно (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "tsconfig.json"
      - ".github/workflows/npm-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token — npm trusted publishing + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          # package-lock.json repo-д байхгүй (.gitignore) тул cache / npm ci ашиглахгүй

      # Trusted publishing нь npm 11.5.1+ шаардана
      - name: Update npm
        run: npm install -g npm@latest && npm -v

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build-ts

      - name: Check whether this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already published — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION not on npm — will publish"
          fi

      - name: Publish (OIDC, provenance)
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public

      - name: Summary
        if: always()
        run: |
          echo "### auth-mn ${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.exists }}" = "false" ]; then
            echo "Published to npm with provenance." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Already on npm — nothing published. Bump the version in package.json to release." >> "$GITHUB_STEP_SUMMARY"
          fi
